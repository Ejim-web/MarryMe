```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarryMe - Serious Dating App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .card-stack { position: relative; width: 100%; height: 100%; }
    .card { position: absolute; inset: 0; border-radius: 1.5rem; overflow: hidden; transition: transform 0.4s ease, opacity 0.4s ease; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15); }
    .card.swipe-left { transform: translateX(-150%) rotate(-25deg) !important; opacity: 0; }
    .card.swipe-right { transform: translateX(150%) rotate(25deg) !important; opacity: 0; }
    .card.swipe-up { transform: translateY(-150%) !important; opacity: 0; }
    .tab-content { display: none; }
    .tab-content.active { display: flex; }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans text-slate-800 select-none">
  <div class="w-full max-w-md h-screen sm:h-[844px] bg-slate-50 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 border-slate-800">
    
    <!-- HEADER -->
    <header class="h-16 px-5 flex items-center justify-between border-b border-slate-100 bg-white z-10 shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white text-lg shadow-md">💍</div>
        <span class="text-xl font-black bg-gradient-to-r from-rose-500 to-pink-600 bg-clip-text text-transparent tracking-tight">MarryMe</span>
      </div>
      <button onclick="alert('Filter preferences: Age 24-35 • Distance < 50mi • Serious Relationship')" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
        <i class="fa-solid fa-sliders text-sm"></i>
      </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 relative overflow-hidden bg-slate-100">
      
      <!-- DISCOVER TAB -->
      <section id="tab-discover" class="tab-content active flex-col h-full p-4 justify-between">
        <div id="card-container" class="card-stack flex-1 relative"></div>
        <div class="h-20 flex items-center justify-center gap-5 pt-3">
          <button onclick="swipe('left')" class="w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center text-rose-500 hover:scale-110 active:scale-95 transition border border-slate-100 text-xl"><i class="fa-solid fa-xmark"></i></button>
          <button onclick="swipe('up')" class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center text-sky-500 hover:scale-110 active:scale-95 transition border border-slate-100 text-lg"><i class="fa-solid fa-star"></i></button>
          <button onclick="swipe('right')" class="w-14 h-14 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 shadow-lg shadow-pink-200 flex items-center justify-center text-white hover:scale-110 active:scale-95 transition text-xl"><i class="fa-solid fa-heart"></i></button>
        </div>
      </section>

      <!-- MATCHES TAB -->
      <section id="tab-matches" class="tab-content flex-col h-full p-4 overflow-y-auto">
        <h2 class="text-lg font-bold text-slate-800 mb-1">Your Matches</h2>
        <p class="text-xs text-slate-400 mb-4">People ready to build a future together</p>
        <div class="grid grid-cols-2 gap-3" id="matches-grid"></div>
      </section>

      <!-- CHAT TAB -->
      <section id="tab-chat" class="tab-content flex-col h-full bg-white">
        <div class="p-4 border-b border-slate-100"><h2 class="text-lg font-bold">Messages</h2></div>
        <div class="divide-y divide-slate-100 overflow-y-auto flex-1" id="chat-list"></div>
      </section>

      <!-- PROFILE TAB -->
      <section id="tab-profile" class="tab-content flex-col h-full p-5 overflow-y-auto bg-white">
        <div class="flex flex-col items-center text-center mt-2">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" class="w-28 h-28 rounded-full object-cover border-4 border-rose-500 shadow-xl" alt="Profile">
            <button class="absolute bottom-0 right-0 bg-rose-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow"><i class="fa-solid fa-camera text-xs"></i></button>
          </div>
          <h3 class="text-xl font-bold mt-3">Sarah Jenkins, 27</h3>
          <p class="text-xs text-slate-400">Architect • Looking for Marriage 💍</p>
        </div>
        <div class="mt-6 space-y-3">
          <div class="p-4 rounded-2xl bg-rose-50 border border-rose-100 flex justify-between items-center">
            <div><h4 class="font-bold text-rose-600 text-sm">MarryMe Gold</h4><p class="text-xs text-rose-400">See who wants to marry you</p></div>
            <button class="bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">Upgrade</button>
          </div>
          <div class="space-y-1 pt-2">
            <button class="w-full p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-sm font-semibold text-slate-700"><span><i class="fa-solid fa-user-pen mr-3 text-slate-400"></i> Edit Profile</span><i class="fa-solid fa-chevron-right text-xs text-slate-300"></i></button>
            <button class="w-full p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-sm font-semibold text-slate-700"><span><i class="fa-solid fa-sliders mr-3 text-slate-400"></i> Marriage Intentions</span><i class="fa-solid fa-chevron-right text-xs text-slate-300"></i></button>
            <button class="w-full p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-sm font-semibold text-slate-700"><span><i class="fa-solid fa-shield-halved mr-3 text-slate-400"></i> Verification</span><i class="fa-solid fa-chevron-right text-xs text-slate-300"></i></button>
            <button class="w-full p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-sm font-semibold text-slate-700"><span><i class="fa-solid fa-gear mr-3 text-slate-400"></i> Settings</span><i class="fa-solid fa-chevron-right text-xs text-slate-300"></i></button>
          </div>
        </div>
      </section>

      <!-- MATCH POPUP MODAL -->
      <div id="match-modal" class="absolute inset-0 bg-slate-900/90 backdrop-blur-md hidden flex-col items-center justify-center p-6 z-50 text-center text-white">
        <div class="text-5xl mb-2 animate-bounce">💍</div>
        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-pink-400">It's a Match!</h2>
        <p class="text-slate-300 text-sm mt-2 mb-6" id="match-text">You and Elena both want to build a future together.</p>
        <div class="flex items-center justify-center gap-4 mb-8">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" class="w-20 h-20 rounded-full border-2 border-white object-cover shadow-lg">
          <div class="w-8 h-8 rounded-full bg-rose-500 flex items-center justify-center text-xs text-white"><i class="fa-solid fa-heart"></i></div>
          <img id="match-avatar" src="" class="w-20 h-20 rounded-full border-2 border-white object-cover shadow-lg">
        </div>
        <button onclick="closeMatchModal();switchTab('chat')" class="w-full py-3.5 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 font-bold shadow-lg shadow-rose-500/30 mb-3">Send Message</button>
        <button onclick="closeMatchModal()" class="w-full py-3 rounded-full bg-slate-800 text-slate-300 font-semibold border border-slate-700">Keep Swiping</button>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="h-16 bg-white border-t border-slate-100 flex items-center justify-around px-2 z-10 shrink-0">
      <button onclick="switchTab('discover')" id="nav-discover" class="nav-btn flex flex-col items-center text-rose-500"><i class="fa-solid fa-layer-group text-lg"></i><span class="text-[10px] font-bold mt-1">Discover</span></button>
      <button onclick="switchTab('matches')" id="nav-matches" class="nav-btn flex flex-col items-center text-slate-400"><i class="fa-solid fa-heart text-lg"></i><span class="text-[10px] font-bold mt-1">Matches</span></button>
      <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn flex flex-col items-center text-slate-400 relative"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px] font-bold mt-1">Chat</span><span class="absolute top-1 right-3 w-2 h-2 rounded-full bg-rose-500"></span></button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center text-slate-400"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] font-bold mt-1">Profile</span></button>
    </nav>
  </div>

  <script>
    const PROFILES = [
      { id: 1, name: 'Elena Rostova', age: 26, job: 'Software Engineer', bio: 'Looking for a serious long-term partner who loves travel, home-cooked dinners, and family values.', tags: ['Ready for Marriage', 'Non-Smoker', 'Family First'], img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80' },
      { id: 2, name: 'David Miller', age: 29, job: 'Architect', bio: 'Passionate about design, sustainability, and finding someone to build a beautiful life with.', tags: ['Wants Kids', 'Dog Person', 'Active'], img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80' },
      { id: 3, name: 'Sophia Chen', age: 28, job: 'Pediatrician', bio: 'Kind-hearted doctor looking for a companion to share quiet weekends, hiking trails, and wedding vows.', tags: ['Serious Only', 'Vegetarian', 'Hiker'], img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80' },
      { id: 4, name: 'Marcus Vance', age: 31, job: 'Financial Analyst', bio: 'Financially stable, family-oriented, and ready to settle down with the right person.', tags: ['Marriage Minded', 'Wine Lover', 'Traveler'], img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=600&q=80' }
    ];

    let currentIndex = 0;
    const matchedProfiles = [PROFILES[0]];

    function init() {
      renderCards();
      renderMatches();
      renderChats();
    }

    function renderCards() {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      if (currentIndex >= PROFILES.length) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-6 bg-white rounded-3xl border border-slate-200">
            <div class="text-4xl mb-3">✨</div>
            <h3 class="text-lg font-bold text-slate-800">No More Profiles Near You</h3>
            <p class="text-xs text-slate-400 mt-1">Check back later or adjust your preference filters.</p>
            <button onclick="currentIndex=0;renderCards()" class="mt-4 px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold">Reset Profiles</button>
          </div>`;
        return;
      }

      for (let i = PROFILES.length - 1; i >= currentIndex; i--) {
        const p = PROFILES[i];
        const card = document.createElement('div');
        card.className = `card bg-slate-900 text-white flex flex-col justify-end p-5`;
        card.style.zIndex = PROFILES.length - i;
        card.id = `card-${i}`;
        card.innerHTML = `
          <img src="${p.img}" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
          <div class="relative z-10">
            <div class="flex items-baseline gap-2">
              <h2 class="text-2xl font-black">${p.name}</h2>
              <span class="text-xl font-light opacity-90">${p.age}</span>
            </div>
            <p class="text-xs text-rose-300 font-semibold mb-2"><i class="fa-solid fa-briefcase mr-1"></i>${p.job}</p>
            <p class="text-xs text-slate-200 line-clamp-2 mb-3">${p.bio}</p>
            <div class="flex flex-wrap gap-1.5">
              ${p.tags.map(t => `<span class="bg-white/20 backdrop-blur-md text-[10px] px-2.5 py-1 rounded-full font-medium">${t}</span>`).join('')}
            </div>
          </div>`;
        container.appendChild(card);
      }
    }

    function swipe(dir) {
      if (currentIndex >= PROFILES.length) return;
      const topCard = document.getElementById(`card-${currentIndex}`);
      if (!topCard) return;

      topCard.classList.add(`swipe-${dir}`);
      const profile = PROFILES[currentIndex];

      if (dir === 'right' || dir === 'up') {
        setTimeout(() => showMatchModal(profile), 200);
      }

      currentIndex++;
      setTimeout(() => { renderCards(); }, 300);
    }

    function showMatchModal(profile) {
      if (!matchedProfiles.find(p => p.id === profile.id)) matchedProfiles.push(profile);
      renderMatches();
      renderChats();
      document.getElementById('match-avatar').src = profile.img;
      document.getElementById('match-text').innerText = `You and ${profile.name.split(' ')[0]} both want to build a future together.`;
      const modal = document.getElementById('match-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeMatchModal() {
      const modal = document.getElementById('match-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('text-rose-500');
        el.classList.add('text-slate-400');
      });

      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`nav-${tab}`).classList.remove('text-slate-400');
      document.getElementById(`nav-${tab}`).classList.add('text-rose-500');
    }

    function renderMatches() {
      const grid = document.getElementById('matches-grid');
      grid.innerHTML = matchedProfiles.map(p => `
        <div class="relative h-44 rounded-2xl overflow-hidden shadow group border border-slate-200">
          <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 right-2 text-white">
            <p class="font-bold text-xs">${p.name}, ${p.age}</p>
            <span class="text-[9px] text-rose-300 font-medium">💍 Serious Match</span>
          </div>
        </div>`).join('');
    }

    function renderChats() {
      const list = document.getElementById('chat-list');
      list.innerHTML = matchedProfiles.map((p, idx) => `
        <div onclick="alert('Opening conversation with ${p.name}')" class="p-4 flex items-center gap-3 hover:bg-slate-50 cursor-pointer transition">
          <img src="${p.img}" class="w-12 h-12 rounded-full object-cover">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h4 class="font-bold text-sm text-slate-800 truncate">${p.name}</h4>
              <span class="text-[10px] text-slate-400">12:34 PM</span>
            </div>
            <p class="text-xs text-slate-500 truncate">${idx === 0 ? "Hey Sarah! It's so nice to connect with you." : "Looking forward to learning more about you!"}</p>
          </div>
        </div>`).join('');
    }

    window.onload = init;
  </script>
</body>
</html>
