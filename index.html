<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <meta name="theme-color" content="#ff3b6b">
  <meta name="description" content="MarryMe — Serious dating for people looking for something real.">

  <title>MarryMe — Serious Dating</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #ffffff;
    }

    .hide {
      display: none !important;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .pink {
      color: #ff3b6b;
    }

    .bgpink {
      background: #ff3b6b;
    }

    .soft {
      background: #fff1f4;
    }

    .card {
      border: 1px solid #eeeeee;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
    }

    .photo {
      width: 100%;
      height: 390px;
      object-fit: cover;
      background: #f3f4f6;
    }

    button {
      touch-action: manipulation;
    }

    .navbtn.active {
      color: #ff3b6b;
    }

    .chip {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      margin: 3px;
      font-size: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet {
      width: min(520px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      background: #ffffff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ff3b6b;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      z-index: 100;
      background: #111827;
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 999px;
      font-size: 13px;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- ========================= -->
  <!-- AUTHENTICATION SCREEN -->
  <!-- ========================= -->

  <div id="authView" class="min-h-screen px-5 py-10 flex items-center">

    <div class="w-full">

      <div class="text-center mb-8">

        <div
          class="w-20 h-20 rounded-3xl bgpink text-white flex items-center justify-center text-4xl mx-auto mb-4"
        >
          <i class="fa-solid fa-ring"></i>
        </div>

        <h1 class="text-3xl font-extrabold">
          MarryMe
        </h1>

        <p class="text-gray-500 mt-2">
          Serious dating for people looking for something real.
        </p>

      </div>


      <!-- LOGIN -->

      <div id="loginBox" class="space-y-3">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          id="loginBtn"
          class="w-full bgpink text-white py-3 rounded-xl font-bold"
        >
          Log in
        </button>

        <button
          id="googleBtn"
          class="w-full border py-3 rounded-xl font-bold"
        >
          <i class="fa-brands fa-google mr-2"></i>
          Continue with Google
        </button>

        <button
          id="forgotBtn"
          class="text-sm pink w-full"
        >
          Forgot password?
        </button>

        <p class="text-center text-sm text-gray-500">
          New here?
          <button
            id="showSignup"
            class="pink font-bold"
          >
            Create account
          </button>
        </p>

      </div>


      <!-- SIGN UP -->

      <div id="signupBox" class="space-y-3 hide">

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password (6+ characters)"
          autocomplete="new-password"
        >

        <label class="flex gap-2 text-sm text-gray-600">
          <input
            id="ageGate"
            type="checkbox"
            class="w-4"
          >

          <span>
            I confirm I am 18 or older and will use MarryMe responsibly.
          </span>
        </label>

        <button
          id="signupBtn"
          class="w-full bgpink text-white py-3 rounded-xl font-bold"
        >
          Create account
        </button>

        <p class="text-center text-sm text-gray-500">
          Already registered?
          <button
            id="showLogin"
            class="pink font-bold"
          >
            Log in
          </button>
        </p>

      </div>

      <p
        id="authError"
        class="text-red-500 text-sm text-center mt-4"
      ></p>

    </div>

  </div>


  <!-- ========================= -->
  <!-- MAIN APPLICATION -->
  <!-- ========================= -->

  <div id="mainView" class="hide">

    <!-- HEADER -->

    <header
      class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b px-4 py-3 flex items-center justify-between"
    >

      <div class="flex items-center gap-2">

        <div
          class="w-9 h-9 rounded-xl bgpink text-white flex items-center justify-center"
        >
          <i class="fa-solid fa-ring"></i>
        </div>

        <b class="text-xl">
          MarryMe
        </b>

      </div>

      <button
        id="filterBtn"
        class="w-10 h-10 rounded-full bg-gray-100"
      >
        <i class="fa-solid fa-sliders"></i>
      </button>

    </header>


    <!-- CONTENT -->

    <main class="px-4 pb-24">


      <!-- DISCOVER -->

      <section
        id="discoverTab"
        class="tab active pt-4"
      >

        <div class="flex items-center justify-between mb-3">

          <div>

            <h2 class="text-xl font-bold">
              Discover
            </h2>

            <p class="text-xs text-gray-500">
              Find people who share your intentions.
            </p>

          </div>

          <span
            id="discoverCount"
            class="text-xs text-gray-400"
          ></span>

        </div>

        <div id="discoverCard"></div>

      </section>


      <!-- MATCHES -->

      <section
        id="matchesTab"
        class="tab pt-4"
      >

        <h2 class="text-xl font-bold mb-4">
          Your Matches
        </h2>

        <div
          id="matchesGrid"
          class="grid grid-cols-2 gap-3"
        ></div>

      </section>


      <!-- CHAT -->

      <section
        id="chatTab"
        class="tab pt-4"
      >

        <h2 class="text-xl font-bold mb-4">
          Messages
        </h2>

        <div
          id="chatList"
          class="space-y-2"
        ></div>

      </section>


      <!-- PROFILE -->

      <section
        id="profileTab"
        class="tab pt-4"
      >

        <div id="myProfile"></div>

      </section>

    </main>


    <!-- ========================= -->
    <!-- BOTTOM NAVIGATION -->
    <!-- ========================= -->

    <nav
      class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t"
    >

      <div class="max-w-[520px] mx-auto grid grid-cols-4">

        <button
          class="navbtn active py-3 text-gray-500"
          data-tab="discoverTab"
        >
          <i class="fa-solid fa-heart text-lg"></i>

          <span class="block text-[11px]">
            Discover
          </span>
        </button>


        <button
          class="navbtn py-3 text-gray-500"
          data-tab="matchesTab"
        >
          <i class="fa-solid fa-people-arrows text-lg"></i>

          <span class="block text-[11px]">
            Matches
          </span>
        </button>


        <button
          class="navbtn py-3 text-gray-500"
          data-tab="chatTab"
        >
          <i class="fa-solid fa-message text-lg"></i>

          <span class="block text-[11px]">
            Messages
          </span>
        </button>


        <button
          class="navbtn py-3 text-gray-500"
          data-tab="profileTab"
        >
          <i class="fa-solid fa-user text-lg"></i>

          <span class="block text-[11px]">
            Profile
          </span>
        </button>

      </div>

    </nav>

  </div>

</div>


<!-- ========================= -->
<!-- PROFILE MODAL -->
<!-- ========================= -->

<div
  id="profileModal"
  class="modal hide"
>

  <div class="sheet">

    <div class="flex justify-between items-center mb-4">

      <h3 class="text-xl font-bold">
        Complete your profile
      </h3>

      <button
        onclick="closeModal('profileModal')"
      >
        ✕
      </button>

    </div>


    <div class="space-y-3">

      <input
        id="pName"
        placeholder="Full name"
      >

      <label class="text-sm text-gray-500">
        Date of birth
      </label>

      <input
        id="pDob"
        type="date"
      >

      <select id="pGender">

        <option value="">
          Gender
        </option>

        <option>
          Woman
        </option>

        <option>
          Man
        </option>

        <option>
          Non-binary
        </option>

      </select>


      <input
        id="pCity"
        placeholder="City"
      >


      <input
        id="pOccupation"
        placeholder="Occupation"
      >


      <select id="pIntent">

        <option value="">
          Relationship intention
        </option>

        <option>
          Marriage
        </option>

        <option>
          Long-term relationship
        </option>

        <option>
          Open to either
        </option>

      </select>


      <select id="pChildren">

        <option value="">
          Children preference
        </option>

        <option>
          Want children
        </option>

        <option>
          Don't want children
        </option>

        <option>
          Open to children
        </option>

        <option>
          Have children
        </option>

      </select>


      <textarea
        id="pBio"
        rows="4"
        maxlength="500"
        placeholder="Tell people about yourself"
      ></textarea>


      <input
        id="pInterests"
        placeholder="Interests, separated by commas"
      >


      <label class="text-sm text-gray-500">
        Profile photos (up to 6)
      </label>


      <input
        id="pPhotos"
        type="file"
        accept="image/*"
        multiple
      >


      <div
        id="photoPreview"
        class="grid grid-cols-3 gap-2"
      ></div>


      <button
        id="saveProfileBtn"
        class="w-full bgpink text-white py-3 rounded-xl font-bold"
      >
        Save profile
      </button>

    </div>

  </div>

</div>


<!-- ========================= -->
<!-- FILTER MODAL -->
<!-- ========================= -->

<div
  id="filterModal"
  class="modal hide"
>

  <div class="sheet">

    <div class="flex justify-between items-center mb-4">

      <h3 class="text-xl font-bold">
        Discover filters
      </h3>

      <button
        onclick="closeModal('filterModal')"
      >
        ✕
      </button>

    </div>


    <div class="space-y-3">

      <div>

        <label class="text-sm text-gray-500">
          Minimum age
        </label>

        <input
          id="minAge"
          type="number"
          min="18"
          max="100"
          value="18"
        >

      </div>


      <div>

        <label class="text-sm text-gray-500">
          Maximum age
        </label>

        <input
          id="maxAge"
          type="number"
          min="18"
          max="100"
          value="70"
        >

      </div>


      <select id="filterGender">

        <option value="">
          Any gender
        </option>

        <option>
          Woman
        </option>

        <option>
          Man
        </option>

        <option>
          Non-binary
        </option>

      </select>


      <select id="filterIntent">

        <option value="">
          Any intention
        </option>

        <option>
          Marriage
        </option>

        <option>
          Long-term relationship
        </option>

        <option>
          Open to either
        </option>

      </select>


      <button
        id="applyFilters"
        class="w-full bgpink text-white py-3 rounded-xl font-bold"
      >
        Apply
      </button>

    </div>

  </div>

</div>


<!-- ========================= -->
<!-- CHAT MODAL -->
<!-- ========================= -->

<div
  id="chatModal"
  class="modal hide"
>

  <div class="sheet h-[90vh] flex flex-col">

    <div
      class="flex justify-between items-center border-b pb-3"
    >

      <div>

        <h3
          id="chatName"
          class="font-bold"
        ></h3>

        <p class="text-xs text-gray-400">
          Matched on MarryMe
        </p>

      </div>

      <button
        onclick="closeModal('chatModal')"
      >
        ✕
      </button>

    </div>


    <div
      id="messages"
      class="flex-1 overflow-auto py-3 space-y-2"
    ></div>


    <form
      id="messageForm"
      class="flex gap-2 pt-2 border-t"
    >

      <input
        id="messageInput"
        maxlength="1000"
        placeholder="Write a message..."
        autocomplete="off"
      >

      <button
        class="bgpink text-white w-12 rounded-xl"
      >
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </form>


    <div class="flex gap-3 pt-3">

      <button
        id="blockBtn"
        class="text-xs text-red-500"
      >
        Block
      </button>

      <button
        id="reportBtn"
        class="text-xs text-red-500"
      >
        Report
      </button>

      <button
        id="unmatchBtn"
        class="text-xs text-gray-500"
      >
        Unmatch
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast hide"
></div>


<!-- ========================= -->
<!-- FIREBASE SDK -->
<!-- ========================= -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>


<!-- Firebase configuration -->

<script src="firebase-config.js"></script>


<!-- Application -->

<script src="app.js"></script>

</body>
</html>
